<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>孩子档案 · 中小学知识图谱</title>
<meta name="description" content="建立孩子档案，分开记录每个孩子的诊断结果和错题。数据只存在本机浏览器。">
<meta name="theme-color" content="#0b0d10">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/people.css">
</head>
<body class="page-children">
<header class="site-header">
  <a class="brand" href="../">
    <svg class="logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><circle cx="9" cy="21" r="2.5" fill="#0b0d10"/><circle cx="17" cy="11" r="2.5" fill="#0b0d10"/><circle cx="24" cy="20" r="2.5" fill="#0b0d10"/><path d="M11.2 19.2 15.2 12.8M18.6 12.6 22.2 18.2" stroke="#0b0d10" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span class="brand-name">中小学知识图谱</span>
  </a>
  <nav class="site-nav" aria-label="主导航">
    <a class="nav-link" href="../">首页</a>
    <div class="nav-item has-menu">
      <button type="button" class="nav-link back" aria-haspopup="true" aria-expanded="false">知识图谱<span class="caret" aria-hidden="true"></span></button>
      <div class="nav-menu" role="menu" aria-label="知识图谱学科" data-group="explore">
        <a class="nav-link subject-link on" data-subject="math" role="menuitem" href="../explore/">数学</a>
        <a class="nav-link subject-link" data-subject="english" role="menuitem" href="../explore/?subject=english">英语</a>
        <a class="nav-link subject-link" data-subject="physics" role="menuitem" href="../explore/?subject=physics">物理</a>
        <a class="nav-link subject-link" data-subject="chinese" role="menuitem" href="../explore/?subject=chinese">语文</a>
      </div>
    </div>
    <div class="nav-item has-menu">
      <button type="button" class="nav-link" aria-haspopup="true" aria-expanded="false">诊断<span class="caret" aria-hidden="true"></span></button>
      <div class="nav-menu" role="menu" aria-label="诊断学科" data-group="diagnose">
        <a class="nav-link subject-link on" data-subject="math" role="menuitem" href="../diagnose/">数学</a>
        <a class="nav-link subject-link" data-subject="english" role="menuitem" href="../diagnose/?subject=english">英语</a>
        <a class="nav-link subject-link" data-subject="physics" role="menuitem" href="../diagnose/?subject=physics">物理</a>
        <a class="nav-link subject-link" data-subject="chinese" role="menuitem" href="../diagnose/?subject=chinese">语文</a>
      </div>
    </div>
    <a class="nav-link active" href="./" aria-current="page">档案</a>
    <a class="nav-link" href="../mistakes/">错题本</a>
    <a class="nav-link" href="https://github.com/zhujiuyi/jiaocaitupu" target="_blank" rel="noopener noreferrer">关于</a>
  </nav>
</header>

<main class="people">
  <div class="people-head">
    <div>
      <h1>孩子档案</h1>
      <p class="muted">每个孩子一套独立的诊断记录和错题本。数据只存在这台设备的浏览器里，换设备或清缓存就没了。</p>
    </div>
    <span class="muted small" id="child-count"></span>
  </div>

  <section class="card">
    <h2>新建 / 编辑</h2>
    <form id="child-form" class="child-form" autocomplete="off">
      <label class="field">
        <span>昵称</span>
        <input id="f-name" type="text" maxlength="12" placeholder="例如：小明" required>
      </label>
      <label class="field">
        <span>年级（备注，不影响内容）</span>
        <select id="f-grade"></select>
      </label>
      <label class="field">
        <span>教材（备注）</span>
        <input id="f-textbook" type="text" maxlength="20" placeholder="例如：人教 A 版">
      </label>
      <div class="form-actions">
        <button id="btn-save" type="submit" class="primary">添加</button>
        <button id="btn-cancel" type="button" class="small" hidden>取消</button>
      </div>
      <p id="form-error" class="form-error" hidden></p>
    </form>
  </section>

  <div id="child-list"></div>
</main>

<script src="../assets/motion.js"></script>
<script src="../assets/nav.js"></script>
<script src="../assets/children.js"></script>
<script src="page.js"></script>
</body>
</html>
